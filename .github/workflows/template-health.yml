name: Template Health Check

# Runs on every push and pull request (no path filters): a template can break
# through the CLI, the shared utilities or a dependency bump, not only through a
# change under packages/cli/src/templates.
on:
  push:
  pull_request:

concurrency:
  group: template-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scaffolds every verified template with the built CLI and builds it with that
  # language's own toolchain (pip/compileall, go build, cargo check, php -l +
  # composer, ruby -c + bundle, mvn package, gradle build, sbt Test/compile,
  # dotnet build, perl -c, luac -p, pnpm + tsc, rescript build, dart analyze, cabal build, zig build, deno check, ...). The templates
  # are split into groups (see scripts/scaffold-test-templates.sh) so each job
  # installs only the toolchains it needs and the groups run in parallel.
  # A template whose toolchain is not installed is reported as SKIP with the
  # reason; a template that fails to build fails the job.
  scaffold-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        group: [core, jvm, dotnet, native, node, config, haskell, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - if: matrix.group == 'core' || matrix.group == 'native'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: matrix.group == 'core' || matrix.group == 'native'
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - if: matrix.group == 'core' || matrix.group == 'native'
        uses: dtolnay/rust-toolchain@stable
      - if: matrix.group == 'core' || matrix.group == 'native'
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - if: matrix.group == 'core' || matrix.group == 'native'
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - if: matrix.group == 'native'
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - if: matrix.group == 'haskell'
        uses: haskell-actions/setup@v2
        with:
          ghc-version: '9.4.7'
          cabal-version: '3.10'
      - if: matrix.group == 'haskell'
        run: cabal update
      - if: matrix.group == 'core' || matrix.group == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - if: matrix.group == 'jvm'
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'
      - if: matrix.group == 'jvm'
        uses: sbt/setup-sbt@v1
      - if: matrix.group == 'dotnet'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      # Oak and Fresh resolve their dependencies from JSR and npm (not deno.land/x).
      - if: matrix.group == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      # Phoenix: Erlang/OTP + Elixir (mix deps.get needs hex.pm, reachable from hosted runners).
      - if: matrix.group == 'core'
        uses: erlef/setup-beam@v1
        with:
          otp-version: '27'
          elixir-version: '1.17'
      - if: matrix.group == 'core'
        uses: oven-sh/setup-bun@v2
      - if: matrix.group == 'core'
        uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      # Perl templates are checked with perl -c against the distribution
      # packages (CPAN is not reachable from every runner network); Lua with
      # luac -p (syntax only); the C++ templates (Drogon, cpp-httplib, Boost.Beast,
      # Pistache) build against the distribution's -dev packages, never FetchContent.
      # Ubuntu's DrogonConfig.cmake find_dependency()s every backend Drogon was built
      # with (MariaDB, Hiredis, yaml-cpp, Brotli, c-ares via Trantor) even when a
      # template does not use them; drogon_ctl (package drogon) generates the CSP views.
      - if: matrix.group == 'native'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            lua5.4 libmojolicious-perl libmojo-jwt-perl libdancer2-perl libcatalyst-perl \
            libcatalyst-action-renderview-perl libcatalyst-model-dbic-schema-perl \
            libcatalyst-plugin-authentication-perl libcatalyst-plugin-authorization-roles-perl \
            libcatalyst-plugin-configloader-perl libcatalyst-plugin-session-perl \
            libcatalyst-plugin-session-store-file-perl libcatalyst-plugin-static-simple-perl \
            libconfig-general-perl libgraphql-perl libjson-maybexs-perl libjson-perl \
            libplack-middleware-crossorigin-perl libtest-www-mechanize-catalyst-perl libyaml-perl \
            cmake build-essential pkg-config drogon libdrogon-dev libpq-dev libmariadb-dev libsqlite3-dev libhiredis-dev libyaml-cpp-dev libbrotli-dev libc-ares-dev libgtest-dev libjsoncpp-dev uuid-dev \
            libcpp-httplib-dev libboost-dev libpistache-dev libssl-dev zlib1g-dev nlohmann-json3-dev libspdlog-dev
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Scaffold and build the ${{ matrix.group }} templates
        run: bash scripts/scaffold-test-templates.sh --group ${{ matrix.group }}

  # Scaffolds each Node/Bun backend, installs it from the repo root, builds it,
  # starts it on a free port with unreachable DB/Redis, waits for /health,
  # probes a functional route and checks that SIGTERM exits cleanly.
  boot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Boot-check generated backends
        run: node scripts/boot-test-templates.mjs --startup-budget 90000
