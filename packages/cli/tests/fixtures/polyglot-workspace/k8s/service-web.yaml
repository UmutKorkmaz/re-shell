apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: demo
  labels:
    app: web
    app.kubernetes.io/name: web
    app.kubernetes.io/managed-by: re-shell
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http
      protocol: TCP
      port: 3000
      targetPort: 3000
