[package]
name = "re-shell-desktop"
version = "1.0.0"
description = "Tauri desktop shell for the Re-Shell dashboard (apps/web). Owns the local hub-server."
authors = ["Umut Korkmaz"]
edition = "2021"
rust-version = "1.77.2"

# See docs/desktop.md for the architecture, the build/sign workflow and what has
# been verified.

[lib]
name = "re_shell_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0.0", features = [] }

[dependencies]
tauri = { version = "2.0.0", features = [] }
serde_json = "1.0"
# OS CSPRNG for the per-launch hub session token.
getrandom = "0.3"

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
# Smaller release binaries for the bundles.
strip = true
