apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: demo
  labels:
    app: api
    app.kubernetes.io/name: api
    app.kubernetes.io/managed-by: re-shell
spec:
  type: ClusterIP
  selector:
    app: api
  ports:
    - name: http
      protocol: TCP
      port: 4000
      targetPort: 4000
