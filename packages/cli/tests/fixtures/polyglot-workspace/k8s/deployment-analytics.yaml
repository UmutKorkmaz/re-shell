apiVersion: apps/v1
kind: Deployment
metadata:
  name: analytics
  namespace: demo
  labels:
    app: analytics
    app.kubernetes.io/name: analytics
    app.kubernetes.io/managed-by: re-shell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: analytics
  template:
    metadata:
      labels:
        app: analytics
        app.kubernetes.io/name: analytics
        app.kubernetes.io/managed-by: re-shell
    spec:
      containers:
        - name: analytics
          image: analytics:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
          env:
            - name: BILLING_URL
              value: http://billing:8081
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
