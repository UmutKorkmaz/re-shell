name: Desktop

# Builds the Tauri desktop app (apps/web/src-tauri) for Linux, macOS and Windows.
#
# Code signing is driven ENTIRELY by repository secrets and is used only when
# the secrets are present. Without them the build still succeeds and the log
# says plainly that the bundles are UNSIGNED. No secret or key lives in the
# repository.
#
#   macOS signing      APPLE_CERTIFICATE (base64 .p12), APPLE_CERTIFICATE_PASSWORD,
#                      APPLE_SIGNING_IDENTITY
#   macOS notarization APPLE_ID, APPLE_PASSWORD (app-specific password), APPLE_TEAM_ID
#   Windows signing    WINDOWS_CERTIFICATE (base64 .pfx), WINDOWS_CERTIFICATE_PASSWORD
#   Updater artifacts  TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# A tag matching `desktop-v*` additionally attaches the bundles to a draft
# GitHub release.

on:
  push:
    tags: ['desktop-v*']
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/desktop.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.9

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # Rust unit + integration tests: hub ownership against the REAL hub bundle.
  # ─────────────────────────────────────────────────────────────────────────────
  rust-tests:
    name: Rust tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Builds contracts + ui, then the dashboard and dist/hub-server.js, which
      # both the Rust compile (frontendDist) and the integration tests need.
      - name: Build the dashboard and the hub bundle
        run: pnpm --filter "@re-shell/dashboard..." run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: cargo test
        working-directory: apps/web/src-tauri
        run: cargo test --locked

  # ─────────────────────────────────────────────────────────────────────────────
  # Bundles per platform
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.platform }}
    permissions:
      # contents: write lets tauri-action attach bundles to a draft release when
      # a `desktop-v*` tag is pushed; ordinary runs only upload workflow artifacts.
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux
            platform: ubuntu-latest
            rust_targets: ''
            tauri_args: ''
          - name: macos
            platform: macos-latest
            rust_targets: aarch64-apple-darwin,x86_64-apple-darwin
            tauri_args: --target universal-apple-darwin
          - name: windows
            platform: windows-latest
            rust_targets: ''
            tauri_args: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Tauri system dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev \
            libjavascriptcoregtk-4.1-dev build-essential pkg-config \
            xvfb x11-utils imagemagick curl

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/web/src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Reads the signing secrets ONLY to test whether they are present, exports
      # the non-empty ones to the later steps, and says in the log exactly what
      # will and will not be signed. Empty secrets are never exported (an empty
      # APPLE_CERTIFICATE must not be mistaken for a real one).
      - name: Detect code-signing credentials
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          export_if_set() {
            local name="$1"
            local value="${!name}"
            if [ -n "$value" ]; then
              local delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}${RANDOM}"
              {
                echo "${name}<<${delimiter}"
                echo "${value}"
                echo "${delimiter}"
              } >> "$GITHUB_ENV"
            fi
          }

          case "${{ matrix.platform }}" in
            macos-latest)
              if [ -n "$APPLE_CERTIFICATE" ] && [ -n "$APPLE_CERTIFICATE_PASSWORD" ] && [ -n "$APPLE_SIGNING_IDENTITY" ]; then
                for v in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY; do export_if_set "$v"; done
                echo "::notice::macOS code signing: ENABLED (Developer ID certificate present)."
                if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
                  for v in APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do export_if_set "$v"; done
                  echo "::notice::macOS notarization: ENABLED (APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID present)."
                else
                  echo "::warning::macOS notarization: DISABLED. APPLE_ID, APPLE_PASSWORD and APPLE_TEAM_ID are not all set, so the bundle is signed but NOT notarized."
                fi
              else
                echo "::warning::macOS code signing: DISABLED. APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD and APPLE_SIGNING_IDENTITY are not all set, so the macOS bundle is UNSIGNED and NOT notarized."
              fi
              ;;
            windows-latest)
              if [ -n "$WINDOWS_CERTIFICATE" ] && [ -n "$WINDOWS_CERTIFICATE_PASSWORD" ]; then
                for v in WINDOWS_CERTIFICATE WINDOWS_CERTIFICATE_PASSWORD; do export_if_set "$v"; done
                echo "::notice::Windows code signing: ENABLED (certificate present)."
              else
                echo "::warning::Windows code signing: DISABLED. WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are not both set, so the Windows installers are UNSIGNED."
              fi
              ;;
            *)
              echo "::notice::Linux bundles (.deb/.rpm/.AppImage) are not code-signed by this workflow."
              ;;
          esac

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            export_if_set TAURI_SIGNING_PRIVATE_KEY
            export_if_set TAURI_SIGNING_PRIVATE_KEY_PASSWORD
            echo "::notice::Updater artifact signing: ENABLED (TAURI_SIGNING_PRIVATE_KEY present); .sig files will be produced."
          else
            echo "::warning::Updater artifact signing: DISABLED. TAURI_SIGNING_PRIVATE_KEY is not set, so no updater signatures are produced."
          fi

      - name: Import Windows code-signing certificate
        if: matrix.platform == 'windows-latest' && env.WINDOWS_CERTIFICATE != ''
        shell: pwsh
        run: |
          $pfx = Join-Path $env:RUNNER_TEMP 'codesign.pfx'
          [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
          Remove-Item $pfx -Force
          "WINDOWS_CERTIFICATE_THUMBPRINT=$($cert.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      # Per-run config override (generated, untracked): the Windows certificate
      # thumbprint and updater artifacts, only when their credentials exist.
      - name: Prepare signing config override
        shell: bash
        working-directory: apps/web
        run: |
          node -e '
            const fs = require("fs");
            const bundle = {};
            if (process.env.WINDOWS_CERTIFICATE_THUMBPRINT) {
              bundle.windows = {
                certificateThumbprint: process.env.WINDOWS_CERTIFICATE_THUMBPRINT,
                digestAlgorithm: "sha256",
                timestampUrl: "http://timestamp.digicert.com",
              };
            }
            if (process.env.TAURI_SIGNING_PRIVATE_KEY) {
              bundle.createUpdaterArtifacts = true;
            }
            fs.writeFileSync("src-tauri/tauri.signing.conf.json", JSON.stringify({ bundle }, null, 2));
          '
          echo "Signing override (no secrets in it):"
          cat src-tauri/tauri.signing.conf.json

      # tauri-action runs `pnpm tauri build`; the config's beforeBuildCommand
      # builds contracts + ui + the dashboard + dist/hub-server.js first.
      - name: Build desktop bundles
        id: tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/web
          tauriScript: pnpm tauri
          args: ${{ matrix.tauri_args }} --config src-tauri/tauri.signing.conf.json
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && format('Re-Shell Desktop {0}', github.ref_name) || '' }}
          releaseBody: 'Desktop bundles for Re-Shell. Requires Node.js 18 or newer on the machine. See docs/desktop.md for signing status.'
          releaseDraft: true
          prerelease: false

      # Smoke test the real Linux binary: it must start its own hub, the webview
      # must connect to it with the token, and the hub must die with the app.
      - name: Smoke test the built app (Linux, xvfb)
        if: matrix.platform == 'ubuntu-latest'
        shell: bash
        run: |
          bash apps/web/src-tauri/scripts/smoke-linux.sh \
            apps/web/src-tauri/target/release/re-shell-desktop \
            "${RUNNER_TEMP}/desktop-smoke"

      - name: Upload smoke test evidence
        if: matrix.platform == 'ubuntu-latest' && always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-smoke-linux
          path: ${{ runner.temp }}/desktop-smoke/
          if-no-files-found: warn

      - name: Upload bundles
        uses: actions/upload-artifact@v4
        with:
          name: re-shell-desktop-${{ matrix.name }}
          if-no-files-found: error
          path: |
            apps/web/src-tauri/target/release/bundle/deb/*.deb
            apps/web/src-tauri/target/release/bundle/rpm/*.rpm
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/web/src-tauri/target/release/bundle/appimage/*.AppImage.sig
            apps/web/src-tauri/target/release/bundle/msi/*.msi
            apps/web/src-tauri/target/release/bundle/msi/*.msi.sig
            apps/web/src-tauri/target/release/bundle/nsis/*.exe
            apps/web/src-tauri/target/release/bundle/nsis/*.exe.sig
            apps/web/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            apps/web/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            apps/web/src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig
