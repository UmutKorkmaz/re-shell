ingress:
  className: nginx
  tls:
    enabled: true
    clusterIssuer: letsencrypt-prod
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
services:
  web:
    image:
      repository: web
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 2
    port: 3000
    env:
      API_URL: http://api:4000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
      enabled: true
      minReplicas: 2
      maxReplicas: 10
      targetCPUUtilizationPercentage: 70
    ingress:
      enabled: true
      host: web.example.com
      path: /
      pathType: Prefix
  api:
    image:
      repository: api
      tag: latest
      pullPolicy: IfNotPresent
    replicas: 2
    port: 4000
    env:
      NODE_ENV: production
      BILLING_URL: http://billing:8081
      ANALYTICS_URL: http://analytics:8000
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi
    autoscaling:
