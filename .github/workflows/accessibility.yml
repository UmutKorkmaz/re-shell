name: Accessibility Audit

# Runs on EVERY push and pull request (no path or branch filters): a change
# anywhere in the workspace (ui package, contracts, CLI output the dashboard
# renders) can regress the dashboard's accessibility, so the audit is not scoped
# to apps/web/src.
on:
  push:
  pull_request:

jobs:
  axe-audit:
    name: axe-core (WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      # @axe-core/playwright is a declared devDependency of apps/web, so the
      # frozen lockfile install is all that is needed (nothing is added at CI time).
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      # `a11y` is the Playwright project that matches e2e/accessibility.spec.ts.
      # It shares the webServer stack (built dashboard + secure hub + real CLI).
      - name: Run accessibility tests
        run: npx playwright test --project=a11y
        working-directory: apps/web
        env:
          CI: 'true'
      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: accessibility-test-results
          path: apps/web/test-results/
          retention-days: 7
