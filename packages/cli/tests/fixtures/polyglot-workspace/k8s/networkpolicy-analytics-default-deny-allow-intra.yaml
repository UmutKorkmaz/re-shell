apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: analytics-default-deny-allow-intra
  namespace: demo
  labels:
    app: analytics
    app.kubernetes.io/name: analytics
    app.kubernetes.io/managed-by: re-shell
spec:
  podSelector:
    matchLabels:
      app: analytics
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: demo
