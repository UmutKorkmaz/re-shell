name: VS Code Extension

# apps/vscode-extension is a pnpm workspace member. This workflow builds it,
# runs its unit + real-hub integration tests, runs the host tests inside a real
# VS Code under Xvfb, and packages the .vsix as a build artifact.
#
# It is path-filtered because the host job downloads a VS Code build; it still
# triggers on changes to everything the extension drives (the CLI, the contracts
# and the hub server).
on:
  push:
    branches: [main, master, develop]
    paths:
      - 'apps/vscode-extension/**'
      - 'packages/contracts/**'
      - 'packages/cli/**'
      - 'apps/web/src/hub-server.ts'
      - 'apps/web/src/hub-server-main.ts'
      - 'apps/web/src/hub/**'
      - 'apps/web/scripts/build-hub.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-extension.yml'
  pull_request:
    branches: [main, master, develop]
    paths:
      - 'apps/vscode-extension/**'
      - 'packages/contracts/**'
      - 'packages/cli/**'
      - 'apps/web/src/hub-server.ts'
      - 'apps/web/src/hub-server-main.ts'
      - 'apps/web/src/hub/**'
      - 'apps/web/scripts/build-hub.mjs'
      - 'pnpm-lock.yaml'
      - '.github/workflows/vscode-extension.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-extension-${{ github.ref }}
  cancel-in-progress: true

env:
  PNPM_VERSION: 9.15.9
  # `stable`, `insiders`, or a pinned version such as 1.85.0 (the engine floor).
  VSCODE_TEST_VERSION: stable

jobs:
  test:
    name: Build / Unit / Integration / VS Code host
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The tests drive the REAL built CLI and the REAL built hub server, so
      # build exactly those (plus the contracts both depend on).
      - name: Build contracts, CLI and hub server
        run: |
          pnpm --filter @re-shell/contracts run build
          pnpm --filter @re-shell/cli run build
          pnpm --filter @re-shell/dashboard run build:hub

      - name: Build extension
        run: pnpm --filter re-shell run build

      - name: Typecheck
        run: pnpm --filter re-shell run typecheck

      - name: Unit tests
        run: pnpm --filter re-shell run test

      - name: Integration tests (real hub + real CLI, no editor)
        run: pnpm --filter re-shell run test:integration

      # Electron's runtime libraries and a virtual display for the editor.
      - name: Install editor runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            xvfb libasound2t64 libgbm1 libgtk-3-0t64 libnss3 libxss1 libxkbfile1

      - name: Cache downloaded VS Code
        uses: actions/cache@v4
        with:
          path: apps/vscode-extension/.vscode-test
          key: vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}-${{ hashFiles('apps/vscode-extension/package.json') }}
          restore-keys: |
            vscode-test-${{ runner.os }}-${{ env.VSCODE_TEST_VERSION }}-

      # Downloads VS Code from update.code.visualstudio.com, starts the real hub
      # with a random token, opens a fixture workspace and runs the suite inside
      # the editor's extension host.
      - name: VS Code host tests (Xvfb)
        working-directory: apps/vscode-extension
        run: xvfb-run -a pnpm run test:host

  package:
    name: Package .vsix
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Minified bundle -> vsce package -> scripts/verify-vsix.mjs (fails the job
      # when the archive is missing files, ships sources, or its bundle requires
      # anything but `vscode` and Node built-ins).
      - name: Package and verify .vsix
        run: pnpm --filter re-shell run package

      - name: Upload .vsix
        uses: actions/upload-artifact@v4
        with:
          name: re-shell-vscode-extension
          path: apps/vscode-extension/*.vsix
          if-no-files-found: error
          retention-days: 30
