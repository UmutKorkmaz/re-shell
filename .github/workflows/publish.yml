name: Publish

on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      # write: the last step creates the GitHub Release for the tag.
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build

      - name: Verify release tag matches the CLI version
        run: |
          node --input-type=module - <<'JS'
          import { readFileSync } from 'node:fs';
          const manifest = JSON.parse(readFileSync('packages/cli/package.json', 'utf8'));
          if (process.env.GITHUB_REF_NAME !== `v${manifest.version}`) {
            throw new Error('Release tag must match the CLI package version.');
          }
          JS

      - name: Verify packed packages from a clean install
        run: node scripts/pack-smoke.mjs --no-build
        env:
          PACK_SMOKE_ARTIFACTS_DIR: ${{ github.workspace }}/release-assets

      - name: Publish @re-shell/contracts
        run: npm publish ./release-assets/re-shell-contracts-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @re-shell/ui
        run: npm publish ./release-assets/re-shell-ui-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @re-shell/cli
        run: npm publish ./release-assets/re-shell-cli-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Publish @re-shell/mcp
        run: npm publish ./release-assets/re-shell-mcp-*.tgz --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*.tgz
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
