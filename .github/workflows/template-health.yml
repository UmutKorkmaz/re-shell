name: Template Health Check

# Runs on every push and pull request (no path filters): a template can break
# through the CLI, the shared utilities or a dependency bump, not only through a
# change under packages/cli/src/templates.
on:
  push:
  pull_request:

concurrency:
  group: template-health-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Scaffolds every representative template with the built CLI and builds it
  # with that language's own toolchain (pip/compileall, go build, cargo check,
  # php -l + composer, ruby -c + bundle, mvn package, zig build, ...).
  # A template whose toolchain is not installed is reported as SKIP with the
  # reason; a template that fails to build fails the job.
  scaffold-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - uses: dtolnay/rust-toolchain@stable
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: oven-sh/setup-bun@v2
      - uses: mlugg/setup-zig@v1
        with:
          version: 0.13.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Scaffold and build representative templates
        run: bash scripts/scaffold-test-templates.sh

  # Scaffolds each Node/Bun backend, installs it from the repo root, builds it,
  # starts it on a free port with unreachable DB/Redis, waits for /health,
  # probes a functional route and checks that SIGTERM exits cleanly.
  boot-check:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.9
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r build
      - name: Boot-check generated backends
        run: node scripts/boot-test-templates.mjs --startup-budget 90000
