apiVersion: apps/v1
kind: Deployment
metadata:
  name: billing
  namespace: demo
  labels:
    app: billing
    app.kubernetes.io/name: billing
    app.kubernetes.io/managed-by: re-shell
spec:
  replicas: 2
  selector:
    matchLabels:
      app: billing
  template:
    metadata:
      labels:
        app: billing
        app.kubernetes.io/name: billing
        app.kubernetes.io/managed-by: re-shell
    spec:
      containers:
        - name: billing
          image: billing:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8081
              name: http
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: prod
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
